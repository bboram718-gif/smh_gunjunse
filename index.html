<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SMH 견적서 생성기</title>
<style>
:root{
  --paper:#fffdfa;--ink:#1d1c19;--sub:#6f6a62;--muted:#9a948b;
  --line:#e7e1d8;--line-strong:#d8cec0;--gold:#b8985a;
  --peach:#e8b8ad;--lav:#cdbbe8;--mint:#61c5a2;--blue:#9fc3e4;
  --track:#efebe4;--red:#b94d4f;--red-soft:#fbf1f1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f0ece4;min-height:100vh;color:var(--ink);}
#form-screen{max-width:640px;margin:0 auto;padding:28px 20px 60px;}
.form-header{margin-bottom:28px;}
.form-logo{font-size:11px;letter-spacing:.18em;color:#8d8880;margin-bottom:6px;}
.form-title{font-size:26px;font-weight:700;letter-spacing:-.04em;margin-bottom:4px;}
.form-sub{font-size:13px;color:var(--sub);}
.card{background:var(--paper);border-radius:16px;padding:20px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card-title{font-size:10.5px;letter-spacing:.14em;color:#99928a;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:.5px solid var(--line);}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:600;}
.field input,.field textarea{width:100%;padding:10px 12px;border:.5px solid var(--line-strong);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);outline:none;transition:border-color .15s;}
.field input:focus,.field textarea:focus{border-color:var(--gold);}
.field textarea{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.price-input-wrap{position:relative;}
.price-input-wrap input{padding-right:28px;}
.price-unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none;}
.total-preview{margin-top:8px;padding:14px;background:#f5efe3;border-radius:10px;font-size:13px;color:var(--sub);line-height:1.9;}
.trow{display:flex;justify-content:space-between;}
.trow.divline{border-top:.5px solid var(--line-strong);margin-top:6px;padding-top:6px;}
.trow.final-line{border-top:1.5px solid var(--ink);margin-top:4px;padding-top:6px;}
.trow .tv{font-weight:600;color:var(--ink);}
.trow .tv.red{color:var(--red);}
.trow.final-line .tv{font-size:16px;font-weight:700;color:var(--gold);}
.sec-block{background:var(--paper);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid var(--gold);}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sec-name-input{flex:1;padding:7px 10px;border:.5px solid var(--line-strong);border-radius:7px;font-size:13px;font-weight:700;font-family:inherit;background:#fff;color:var(--ink);margin-right:8px;}
.btn-del-sec{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;line-height:1;}
.item-block{margin-bottom:10px;padding-bottom:10px;border-bottom:.5px solid var(--line);}
.item-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.item-top{display:flex;gap:8px;align-items:center;margin-bottom:4px;}
.item-name{flex:1;padding:8px 10px;border:.5px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;background:#faf8f4;color:var(--ink);}
.item-price-wrap{position:relative;width:140px;flex-shrink:0;}
.item-price-wrap input{width:100%;padding:8px 26px 8px 10px;border:.5px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;background:#faf8f4;color:var(--ink);text-align:right;}
.item-price-wrap .pu{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none;}
.item-desc{width:100%;padding:6px 10px;border:.5px solid var(--line);border-radius:7px;font-size:11.5px;font-family:inherit;background:#faf8f4;color:var(--sub);}
.btn-del-item{background:none;border:none;color:#ccc;font-size:15px;cursor:pointer;padding:2px;flex-shrink:0;}
.btn-add-item{width:100%;margin-top:10px;padding:9px;border:1px dashed var(--line-strong);border-radius:8px;background:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;}
.btn-add-item:hover{border-color:var(--gold);color:var(--gold);}
.btn-add-sec{width:100%;padding:13px;border:1.5px dashed var(--line-strong);border-radius:12px;background:none;color:var(--sub);font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:14px;}
.btn-add-sec:hover{border-color:var(--gold);color:var(--gold);}
.btn-generate{width:100%;padding:16px;background:var(--ink);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:-.02em;margin-top:4px;}
.btn-generate:hover{background:#333;}
#preview-screen{display:none;}
.preview-toolbar{position:sticky;top:0;z-index:100;background:var(--ink);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.btn-back{background:none;border:1.5px solid rgba(255,255,255,.3);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;}
.toolbar-right{display:flex;gap:8px;}
.btn-dl{background:var(--gold);border:none;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-print{background:none;border:1.5px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
#quote-output{max-width:600px;margin:0 auto;padding:24px 20px 36px;background:var(--paper);min-height:calc(100vh - 60px);}
.q-logo{font-size:11px;letter-spacing:.16em;color:#8d8880;margin-bottom:6px;}
.q-cover{
  text-align:center;
  padding-top:24px;
  margin-bottom:28px;
}
.q-cover-logo{
  font-family:Georgia,'Times New Roman',serif;
  font-size:11px;
  letter-spacing:.42em;
  color:var(--gold);
  font-weight:500;
  margin-bottom:6px;
}
.q-cover-tags{
  font-size:7.8px;
  letter-spacing:.015em;
  color:var(--gold);
  margin-bottom:10px;
}
.q-cover-tags span{
  padding:0 8px;
}
.q-cover-ornament{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  margin:0 auto 25px;
  color:var(--gold);
}
.q-cover-ornament::before,
.q-cover-ornament::after{
  content:"";
  width:48px;
  height:.7px;
  background:var(--gold);
  opacity:.85;
}
.q-cover-dot{
  width:5px;
  height:5px;
  background:var(--gold);
  transform:rotate(45deg);
  margin:0 7px;
}
.q-cover-title{
  font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  font-size:30px;
  font-weight:500;
  letter-spacing:-.04em;
  line-height:1.15;
  margin-bottom:9px;
  color:var(--ink);
}
.q-cover-project{
  font-size:14px;
  letter-spacing:.04em;
  color:var(--gold);
  font-weight:600;
  min-height:20px;
}

.q-header{border-bottom:2px solid var(--ink);padding-bottom:12px;}
.q-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.q-title{font-size:28px;font-weight:650;letter-spacing:-.055em;line-height:1.1;margin-bottom:6px;}
.q-sub{font-size:13px;line-height:1.55;color:var(--sub);}
.q-meta{text-align:right;font-size:11px;line-height:1.72;color:var(--muted);white-space:nowrap;}
.q-client{margin-top:11px;font-size:12.5px;line-height:1.8;color:var(--sub);}
.q-client b{color:var(--ink);font-weight:650;}
.q-sep{color:#c8c0b5;padding:0 7px;}
.q-total{margin-top:4px;border-top:4px solid var(--gold);border-bottom:.5px solid var(--line-strong);padding:15px 0 14px;}
.q-total-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.q-total-label{font-size:13px;color:var(--sub);font-weight:600;}
.q-vat{font-size:11px;color:var(--muted);}
.q-total-price{font-size:36px;line-height:1;font-weight:750;letter-spacing:-.065em;}
.q-divider{margin:17px 0 7px;}
.q-divider .dg{height:4px;background:var(--gold);border-radius:8px;}
.q-divider .db{margin-top:4px;height:2px;background:var(--ink);border-radius:8px;}
.q-section{padding-top:14px;}
.q-section+.q-section{border-top:.5px solid var(--line-strong);margin-top:2px;}
.q-sec-label{font-size:10.5px;letter-spacing:.14em;color:#99928a;font-weight:700;margin-bottom:4px;}
.q-row{padding:12px 0;border-bottom:.5px solid var(--line);}
.q-section .q-row:last-child{border-bottom:0;}
.q-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;}
.q-name{font-size:14px;font-weight:560;letter-spacing:-.035em;}
.q-price{font-size:14px;font-weight:650;letter-spacing:-.04em;text-align:right;white-space:nowrap;flex-shrink:0;}
.q-bar{height:5px;background:var(--track);border-radius:4px;overflow:hidden;margin-bottom:5px;}
.q-fill{display:block;height:100%;border-radius:4px;}
.q-desc{font-size:11.5px;line-height:1.58;color:#8a847c;}
.q-fixed-row{padding:12px 0;border-bottom:.5px solid var(--line);}
.q-fixed-row .q-name{color:var(--sub);font-weight:500;}
.q-fixed-row .q-price{color:var(--sub);}
.q-adjust{margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px;background:var(--red-soft);}
.q-adjust .q-name,.q-adjust .q-price{color:var(--red);}
.q-tag{display:inline-block;margin-right:6px;padding:1px 6px 2px;border-radius:999px;background:rgba(185,77,79,.08);color:var(--red);font-size:10px;font-weight:700;vertical-align:1px;}
.q-adjust .q-desc{color:#9a6666;}
.q-sec-total{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:7px 0 2px;margin-top:2px;border-top:.5px dashed var(--line-strong);}
.q-sec-total-label{font-size:10.5px;color:var(--muted);letter-spacing:.04em;}
.q-sec-total-val{font-size:12.5px;font-weight:650;color:var(--sub);letter-spacing:-.03em;}
.q-final{margin:14px 0 0;padding:13px 0 0;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
.q-final-k{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:3px;}
.q-final-note{display:block;font-size:10.5px;color:var(--muted);}
.q-final-price{font-size:28px;line-height:1;font-weight:760;letter-spacing:-.055em;white-space:nowrap;}
.q-memo{margin-top:22px;margin-bottom:22px;}
.q-memo-title{font-size:11px;letter-spacing:.12em;color:#5f564b;font-weight:800;margin-bottom:8px;}
.q-memo-box{border:1px solid var(--line-strong);border-left:4px solid var(--gold);background:#fbf8f2;border-radius:12px;padding:14px 15px;}
.q-memo-box p{position:relative;margin:0;padding-left:11px;font-size:13px;line-height:1.76;color:#3f3a34;font-weight:560;}
.q-memo-box p+p{margin-top:7px;}
.q-memo-box p::before{content:"";position:absolute;left:0;top:.82em;width:4px;height:4px;border-radius:50%;background:var(--gold);}
.q-payment{margin-top:4px;padding-top:12px;border-top:.5px solid var(--line-strong);}
.q-pay-title{font-size:10.5px;letter-spacing:.12em;color:#8a847b;font-weight:700;margin-bottom:7px;}
.q-pay-line{font-size:12.5px;line-height:1.75;color:var(--sub);}
.q-pay-line b{color:var(--ink);font-weight:650;}
.q-account{margin-top:8px;padding:9px 11px;border:.5px solid var(--line);border-radius:8px;background:#fff;}
.q-account-k{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.10em;margin-bottom:3px;}
.q-account-v{font-size:15px;font-weight:650;}
.q-footer{margin-top:17px;padding-top:13px;border-top:.5px solid var(--line-strong);}
.q-info{font-size:12px;line-height:1.75;color:var(--sub);}
.q-info b{color:var(--ink);font-weight:650;}
.q-note{margin-top:8px;font-size:10.5px;line-height:1.65;color:var(--muted);}
@media print{
  @page{
    size:auto;
    margin:0;
  }

  *{
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }

  .preview-toolbar{display:none!important;}

  html,body{
    background:#f0ece4!important;
    margin:0!important;
    padding:0!important;
  }

  #quote-output{
    background:var(--paper)!important;
    padding:52px 20px 36px!important;
    margin:0 auto!important;
    min-height:auto!important;
  }

  .q-bar,.q-fill,.q-total,.q-divider .dg,.q-divider .db,.q-adjust,.q-memo-box{
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="form-screen">
  <div class="form-header">
    <p class="form-logo">SMH INTERIOR</p>
    <p class="form-title">견적서 생성기</p>
    <p class="form-sub">입력하면 바로 견적서가 만들어집니다</p>
  </div>

  <div class="card" style="border:1px solid var(--gold);">
    <p class="card-title">엑셀로 불러오기</p>
    <p style="font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:10px;">엑셀 템플릿(<b>설정</b>·<b>항목</b> 탭)을 채워서 올리면 아래 폼이 자동으로 채워집니다.</p>
    <input id="excel-file" type="file" accept=".xlsx,.xls,.xlsm" style="display:none" onchange="importExcel(this.files[0])"/>
    <button type="button" class="btn-add-sec" style="margin-bottom:0;border-color:var(--gold);color:var(--gold);" onclick="document.getElementById('excel-file').click()">📄 엑셀 파일 선택</button>
    <p id="import-status" style="font-size:12px;margin-top:9px;color:var(--sub);line-height:1.5;"></p>
  </div>

  <div class="card">
    <p class="card-title">기본 정보</p>
    <div class="field"><label>견적서 제목</label><input id="f-title" type="text" value="약식 견적서"/></div>
    <div class="field"><label>프로젝트명</label><input id="f-project" type="text" placeholder="예: 가락동 115-17 빌라 올수리"/></div>
    <div class="row2">
      <div class="field"><label>고객명</label><input id="f-client" type="text" placeholder="예: 박옥주 사모님"/></div>
      <div class="field"><label>작성일</label><input id="f-date" type="text"/></div>
    </div>
    <div class="row2">
      <div class="field"><label>유효기간</label><input id="f-validity" type="text" value="14일"/></div>
      <div class="field"><label>부가세</label><input id="f-vat" type="text" value="부가세 별도"/></div>
    </div>
  </div>

  <div id="sections-wrap"></div>
  <button class="btn-add-sec" onclick="addSection()">+ 섹션 추가</button>

  <div class="card">
    <p class="card-title">경비 · 운영 설정 (기본값 10%)</p>
    <div class="row2">
      <div class="field">
        <label>공사 경비율 (%)</label>
        <div class="price-input-wrap">
          <input id="f-rate-gyeongbi" type="number" min="0" max="100" step="0.5" value="10" oninput="updateTotal()"/>
          <span class="price-unit">%</span>
        </div>
      </div>
      <div class="field">
        <label>현장 관리·운영율 (%)</label>
        <div class="price-input-wrap">
          <input id="f-rate-iyun" type="number" min="0" max="100" step="0.5" value="10" oninput="updateTotal()"/>
          <span class="price-unit">%</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">절삭 / 할인 (없으면 비워두세요)</p>
    <div class="row2">
      <div class="field">
        <label>할인 금액 (원)</label>
        <div class="price-input-wrap">
          <input id="f-discount" type="text" placeholder="0" oninput="fmtField(this);updateTotal()"/>
          <span class="price-unit">원</span>
        </div>
      </div>
      <div class="field"><label>할인 설명</label><input id="f-discount-desc" type="text" value="견적 조정으로 할인 적용"/></div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">결제 조건 · 입금 계좌</p>
    <div class="row2">
      <div class="field"><label>계약금 (%)</label><div class="price-input-wrap"><input id="f-pay-down" type="number" min="0" max="100" step="1" value="50"/><span class="price-unit">%</span></div></div>
      <div class="field"><label>중도금 (%)</label><div class="price-input-wrap"><input id="f-pay-mid" type="number" min="0" max="100" step="1" value="30"/><span class="price-unit">%</span></div></div>
    </div>
    <div class="row2">
      <div class="field"><label>잔금 (%)</label><div class="price-input-wrap"><input id="f-pay-final" type="number" min="0" max="100" step="1" value="20"/><span class="price-unit">%</span></div></div>
      <div class="field"><label>입금 계좌</label><input id="f-account" type="text" value="국민은행 4525-0201-161262"/></div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">합계 (자동 계산)</p>
    <div id="total-preview" class="total-preview">항목 금액을 입력하면 자동으로 계산됩니다.</div>
  </div>

  <div class="card">
    <p class="card-title">전달 메모 (줄바꿈으로 구분)</p>
    <div class="field"><textarea id="f-memo" placeholder="예: 철거 후 예외 하자 발견 시 추가 비용이 발생할 수 있습니다.&#10;가구·가전 등 별도 발주 품목은 제외됩니다."></textarea></div>
  </div>

  <button class="btn-generate" onclick="generate()">견적서 생성 →</button>
</div>

<div id="preview-screen">
  <div class="preview-toolbar">
    <button class="btn-back" onclick="goBack()">← 수정</button>
    <div class="toolbar-right">
      <button class="btn-print" onclick="preparePrint()">🖨 PDF 저장</button>
      <button class="btn-dl" onclick="downloadHTML()">💾 HTML 저장</button>
    </div>
  </div>
  <div id="quote-output"></div>
</div>

<script>
const SEC_COLORS = ['var(--lav)','var(--peach)','var(--mint)','var(--blue)'];
const SEC_HEX   = ['#cdbbe8','#e8b8ad','#61c5a2','#9fc3e4'];
let secCount = 0;

// 오늘 날짜 자동입력
(function(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  document.getElementById('f-date').value = `${y}.${m}.${day}`;
})();

function fmtField(inp) {
  const raw = inp.value.replace(/[^0-9]/g,'');
  inp.value = raw ? parseInt(raw).toLocaleString() : '';
}

function fmtItemPrice(inp) {
  const v = inp.value.trim();
  const special = ['별도 협의','서비스','-'].some(s => v.startsWith(s));
  if (!special) {
    const raw = v.replace(/[^0-9]/g,'');
    if (raw) inp.value = parseInt(raw).toLocaleString();
  }
  updateTotal();
}

function parseWon(str) {
  if (!str) return 0;
  str = str.toString().trim().replace(/,/g,'');
  if (['별도 협의','서비스','-',''].includes(str)) return 0;
  return parseInt(str.replace(/[^0-9]/g,''))||0;
}

function formatWon(n) {
  if (n===0) return '0원';
  const man = n/10000;
  if (Number.isInteger(man)) return man.toLocaleString()+'만원';
  return man.toFixed(1).replace(/\.0$/,'')+'만원';
}

function getRates() {
  const rg = parseFloat(document.getElementById('f-rate-gyeongbi').value);
  const ri = parseFloat(document.getElementById('f-rate-iyun').value);
  return {
    rg: isNaN(rg) ? 10 : rg,
    ri: isNaN(ri) ? 10 : ri
  };
}

function calcAmounts() {
  let itemSum = 0;
  document.querySelectorAll('.item-price').forEach(inp => { itemSum += parseWon(inp.value); });
  const { rg, ri } = getRates();
  const gyeongbi = Math.round(itemSum * rg / 100);
  const iyun     = Math.round(itemSum * ri / 100);
  const subtotal = itemSum + gyeongbi + iyun;
  const discount = parseWon(document.getElementById('f-discount').value);
  const final    = subtotal - discount;
  return { itemSum, gyeongbi, iyun, subtotal, discount, final, rg, ri };
}

function updateTotal() {
  const { itemSum, gyeongbi, iyun, subtotal, discount, final, rg, ri } = calcAmounts();
  const el = document.getElementById('total-preview');
  if (itemSum === 0) { el.innerHTML = '항목 금액을 입력하면 자동으로 계산됩니다.'; return; }
  el.innerHTML = `
    <div class="trow"><span>항목 합계</span><span class="tv">${formatWon(itemSum)}</span></div>
    <div class="trow"><span>공사 경비 (${rg}%)</span><span class="tv">${formatWon(gyeongbi)}</span></div>
    <div class="trow"><span>현장 관리·운영 (${ri}%)</span><span class="tv">${formatWon(iyun)}</span></div>
    <div class="trow divline"><span>소계</span><span class="tv">${formatWon(subtotal)}</span></div>
    ${discount>0?`<div class="trow"><span>절삭</span><span class="tv red">-${formatWon(discount)}</span></div>`:''}
    <div class="trow final-line"><span>최종 견적 금액</span><span class="tv">${formatWon(final)}</span></div>
  `;
}

function addSection(name='', items=[]) {
  const idx = secCount++;
  const wrap = document.getElementById('sections-wrap');
  const div = document.createElement('div');
  div.className = 'sec-block';
  div.style.borderLeftColor = SEC_HEX[idx%4];
  div.innerHTML = `
    <div class="sec-header">
      <input class="sec-name-input" type="text" placeholder="섹션명 (예: 전기)" value="${name}"/>
      <button class="btn-del-sec" onclick="this.closest('.sec-block').remove();updateTotal()">✕</button>
    </div>
    <div class="items-wrap"></div>
    <button class="btn-add-item" onclick="addItem(this.previousElementSibling)">+ 항목 추가</button>
  `;
  wrap.appendChild(div);
  const iw = div.querySelector('.items-wrap');
  if (items.length) items.forEach(it => addItem(iw, it.name, it.price, it.desc));
  else addItem(iw);
}

function addItem(wrap, name='', price='', desc='') {
  const d = document.createElement('div');
  d.className = 'item-block';
  d.innerHTML = `
    <div class="item-top">
      <input class="item-name" type="text" placeholder="항목명" value="${name}"/>
      <div class="item-price-wrap">
        <input class="item-price" type="text" placeholder="금액 또는 별도 협의" value="${price}" oninput="fmtItemPrice(this)"/>
        <span class="pu">원</span>
      </div>
      <button class="btn-del-item" onclick="this.closest('.item-block').remove();updateTotal()">✕</button>
    </div>
    <input class="item-desc" type="text" placeholder="설명 (선택)" value="${desc}"/>
  `;
  wrap.appendChild(d);
}

addSection('전기');
addSection('목공');
addSection('마감');

function buildContent(forFile) {
  const title    = document.getElementById('f-title').value||'약식 견적서';
  const project  = document.getElementById('f-project').value||'';
  const client   = document.getElementById('f-client').value||'';
  const date     = document.getElementById('f-date').value||'';
  const validity = document.getElementById('f-validity').value||'14일';
  const vat      = document.getElementById('f-vat').value||'부가세 별도';
  const discDesc = document.getElementById('f-discount-desc').value||'견적 조정으로 할인 적용';
  const memos    = (document.getElementById('f-memo').value||'').split('\n').filter(l=>l.trim());
  const payDown  = (document.getElementById('f-pay-down').value||'').trim()  || '50';
  const payMid   = (document.getElementById('f-pay-mid').value||'').trim()   || '30';
  const payFinal = (document.getElementById('f-pay-final').value||'').trim() || '20';
  const account  = (document.getElementById('f-account').value||'').trim()   || '국민은행 4525-0201-161262';

  const { itemSum, gyeongbi, iyun, discount, final, rg, ri } = calcAmounts();
  const totalStr = formatWon(final);
  const baseForBar = final > 0 ? final : (itemSum + gyeongbi + iyun);

  const secBlocks = document.querySelectorAll('.sec-block');
  const sections = [];
  let globalMax = 1;
  secBlocks.forEach((sb) => {
    sb.querySelectorAll('.item-price').forEach(inp => {
      const v = parseWon(inp.value);
      if (v > globalMax) globalMax = v;
    });
  });
  secBlocks.forEach((sb,si) => {
    const sname = sb.querySelector('.sec-name-input').value||`섹션 ${si+1}`;
    const items = [];
    sb.querySelectorAll('.item-block').forEach(ib => {
      const n = ib.querySelector('.item-name').value||'';
      const p = ib.querySelector('.item-price').value||'';
      const d = ib.querySelector('.item-desc').value||'';
      if (n) items.push({name:n,price:p,desc:d});
    });
    if (items.length) sections.push({name:sname,items,ci:si%4});
  });

  let body = '';
  sections.forEach((sec) => {
    const colorVar = SEC_COLORS[sec.ci];
    body += `<section class="q-section"><div class="q-sec-label">${sec.name}</div>`;
    let secSum = 0;
    sec.items.forEach(it => {
      const amt = parseWon(it.price);
      secSum += amt;
      const special = ['별도 협의','서비스','-',''].includes((it.price||'').trim().replace(/,/g,''));
      const pct = special ? 0 : (amt > 0 ? Math.max(4, Math.round(amt / globalMax * 100)) : 0);
      const displayPrice = special ? (it.price||'별도 협의') : (formatWon(amt)+' 내외');
      body += `<div class="q-row">
        <div class="q-row-top"><div class="q-name">${it.name}</div><div class="q-price">${displayPrice}</div></div>
        <div class="q-bar"><span class="q-fill" style="width:${pct}%;background:${colorVar}"></span></div>
        ${it.desc?`<div class="q-desc">${it.desc}</div>`:''}
      </div>`;
    });
    if (sec.items.length > 1 && secSum > 0) {
      body += `<div class="q-sec-total"><span class="q-sec-total-label">${sec.name} 소계</span><span class="q-sec-total-val">${formatWon(secSum)}</span></div>`;
    }
    body += `</section>`;
  });

  // 경비·운영 섹션의 바도 전체 기준
  const gyeongbiPct = baseForBar > 0 ? Math.max(4, Math.round(gyeongbi / baseForBar * 100)) : 0;
  const iyunPct     = baseForBar > 0 ? Math.max(4, Math.round(iyun     / baseForBar * 100)) : 0;

  body += `<section class="q-section">
    <div class="q-sec-label">경비 · 운영</div>
    <div class="q-row q-fixed-row">
      <div class="q-row-top"><div class="q-name">공사 경비</div><div class="q-price">${formatWon(gyeongbi)}</div></div>
      <div class="q-bar"><span class="q-fill" style="width:${gyeongbiPct}%;background:var(--lav)"></span></div>
      <div class="q-desc">공사 전체 폐기물 처리 / 작업자 식대 & 경비 / 공과 잡비 (항목 합계의 ${rg}%)</div>
    </div>
    <div class="q-row q-fixed-row">
      <div class="q-row-top"><div class="q-name">현장 관리·운영</div><div class="q-price">${formatWon(iyun)}</div></div>
      <div class="q-bar"><span class="q-fill" style="width:${iyunPct}%;background:var(--lav)"></span></div>
      <div class="q-desc">공사 운영 및 감리, 관리 기준 (항목 합계의 ${ri}%)</div>
    </div>
    ${discount>0?`
    <div class="q-row q-adjust">
      <div class="q-row-top"><div class="q-name">절삭</div><div class="q-price">-${formatWon(discount)}</div></div>
      <div class="q-bar"><span class="q-fill" style="width:15%;background:var(--red)"></span></div>
      <div class="q-desc"><span class="q-tag">할인 반영</span>${discDesc}</div>
    </div>`:''}
    <div class="q-final">
      <div><span class="q-final-k">최종 견적 금액</span><span class="q-final-note">${vat}</span></div>
      <div class="q-final-price">${totalStr}</div>
    </div>
  </section>`;

  if (memos.length) {
    body += `<section class="q-memo"><p class="q-memo-title">전달 메모</p><div class="q-memo-box">`;
    memos.forEach(m => { body += `<p>${m}</p>`; });
    body += `</div></section>`;
  }

  body += `
  <section class="q-payment">
    <p class="q-pay-title">결제 조건</p>
    <p class="q-pay-line"><b>계약금</b> ${payDown}% <span class="q-sep">|</span> <b>중도금</b> ${payMid}% <span class="q-sep">|</span> <b>잔금</b> ${payFinal}%</p>
    <div class="q-account"><span class="q-account-k">입금 계좌</span><div class="q-account-v">${account}</div></div>
  </section>
  <footer class="q-footer">
    <p class="q-info"><b>사업자번호</b> 801-54-00594 <span class="q-sep">|</span> <b>연락처</b> 010-5017-5180</p>
    <p class="q-info"><b>주소</b> 서울 양천구 남부순환로 40길 74 1층</p>
    <p class="q-note">본 견적은 약식 견적 기준이며, 현장 상황 및 선택 자재에 따라 세부 금액은 변동될 수 있습니다.</p>
  </footer>`;

  const inner = `
    <section class="q-cover">
      <p class="q-cover-logo">SMH INTERIOR</p>
      <p class="q-cover-tags">Design <span>·</span> Commercial <span>·</span> Residential</p>
      <div class="q-cover-ornament"><span class="q-cover-dot"></span></div>
      <p class="q-cover-title">${title}</p>
      <p class="q-cover-project">${project}</p>
    </section>
    <header class="q-header">
      <div class="q-header-row">
        <div><p class="q-sub"></p></div>
        <div class="q-meta">${date}<br>유효기간 ${validity}<br>${vat}</div>
      </div>
      <div class="q-client"><b>고객</b> ${client}<span class="q-sep">|</span><b>업체</b> SMH 인테리어<span class="q-sep">|</span><b>담당</b> 신명후 대표</div>
    </header>
    <section class="q-total">
      <div class="q-total-head"><span class="q-total-label">최종 견적 금액</span><span class="q-vat">${vat}</span></div>
      <div class="q-total-price">${totalStr}</div>
    </section>
    <div class="q-divider"><div class="dg"></div><div class="db"></div></div>
    ${body}`;

  if (!forFile) return inner;

  const css = document.querySelector('style').innerHTML;
  return `<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SMH ${project} 견적서</title>
<style>${css}</style></head>
<body><div id="quote-output">${inner}</div></body></html>`;
}

function safeFileName(str) {
  return (str || '')
    .toString()
    .trim()
    .replace(/[\\/:*?"<>|]/g, '')
    .replace(/\s+/g, ' ')
    .slice(0, 80);
}

function getQuoteFileBaseName() {
  const title = safeFileName(document.getElementById('f-title').value) || '견적서';
  return `${title}_SMH_INTERIOR`;
}

function importExcel(file) {
  if (!file) return;
  const status = document.getElementById('import-status');
  if (typeof XLSX === 'undefined') {
    status.style.color = 'var(--red)';
    status.textContent = '⚠ 엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.';
    return;
  }
  status.style.color = 'var(--sub)';
  status.textContent = '불러오는 중...';
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const n = applyWorkbook(wb);
      status.style.color = 'var(--mint)';
      status.textContent = '✓ ' + n + '개 항목을 불러왔습니다. 내용 확인 후 [견적서 생성]을 누르세요.';
    } catch (err) {
      status.style.color = 'var(--red)';
      status.textContent = '⚠ 읽기 실패: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

function findSheet(wb, prefix) {
  if (wb.Sheets[prefix]) return wb.Sheets[prefix];
  const hit = wb.SheetNames.find(k => k.replace(/\s/g, '').indexOf(prefix) !== -1);
  return hit ? wb.Sheets[hit] : null;
}

function applyWorkbook(wb) {
  const setSheet = findSheet(wb, '설정');
  const itemSheet = findSheet(wb, '항목');
  if (!setSheet || !itemSheet) throw new Error("'설정' 또는 '항목' 탭을 찾을 수 없습니다.");

  // ---- 설정 ----
  const setRows = XLSX.utils.sheet_to_json(setSheet, { header: 1, defval: '' });
  const memos = [];
  const map = {};
  setRows.forEach(row => {
    const key = (row[0] == null ? '' : row[0]).toString().trim();
    if (!key) return;
    const val = row[1];
    if (key.indexOf('메모') === 0) {
      const t = (val == null ? '' : val).toString().trim();
      if (t) memos.push(t);
      return;
    }
    map[key] = val;
  });
  const get = prefix => {
    const k = Object.keys(map).find(k => k.indexOf(prefix) === 0);
    return k === undefined ? undefined : map[k];
  };
  const setText = (id, v) => {
    if (v != null && v.toString().trim() !== '') document.getElementById(id).value = v.toString().trim();
  };

  setText('f-title', get('견적서 제목'));
  setText('f-project', get('프로젝트명'));
  setText('f-client', get('고객명'));
  const dt = get('작성일');
  if (dt != null && dt.toString().trim() !== '') document.getElementById('f-date').value = dt.toString().trim();
  setText('f-validity', get('유효기간'));
  setText('f-vat', get('부가세'));

  const rg = get('공사 경비율');
  if (rg != null && rg.toString().trim() !== '') document.getElementById('f-rate-gyeongbi').value = parseFloat(rg) || 0;
  const ri = get('현장 관리');
  if (ri != null && ri.toString().trim() !== '') document.getElementById('f-rate-iyun').value = parseFloat(ri) || 0;

  const disc = get('할인 금액');
  const discEl = document.getElementById('f-discount');
  if (disc != null && disc.toString().trim() !== '') {
    const nn = parseInt(disc.toString().replace(/[^0-9]/g, '')) || 0;
    discEl.value = nn ? nn.toLocaleString() : '';
  }
  setText('f-discount-desc', get('할인 설명'));
  const pd = get('계약금'); if (pd != null && pd.toString().trim() !== '') document.getElementById('f-pay-down').value = parseFloat(pd) || 0;
  const pm = get('중도금'); if (pm != null && pm.toString().trim() !== '') document.getElementById('f-pay-mid').value = parseFloat(pm) || 0;
  const pf = get('잔금');   if (pf != null && pf.toString().trim() !== '') document.getElementById('f-pay-final').value = parseFloat(pf) || 0;
  setText('f-account', get('입금 계좌'));
  document.getElementById('f-memo').value = memos.join('\n');

  // ---- 항목 ----
  const itemRows = XLSX.utils.sheet_to_json(itemSheet, { header: 1, defval: '' });
  const sections = [];
  let cur = '';
  let count = 0;
  for (let i = 1; i < itemRows.length; i++) {
    const row = itemRows[i];
    const sec = (row[0] == null ? '' : row[0]).toString().trim();
    const name = (row[1] == null ? '' : row[1]).toString().trim();
    const price = row[2];
    const desc = (row[3] == null ? '' : row[3]).toString().trim();
    if (sec) cur = sec;
    if (!name) continue;
    const secName = cur || '섹션';
    let bucket = sections.find(s => s.name === secName);
    if (!bucket) { bucket = { name: secName, items: [] }; sections.push(bucket); }
    let pstr = '';
    if (typeof price === 'number') {
      pstr = price.toLocaleString();
    } else {
      const raw = (price == null ? '' : price).toString().trim();
      const special = ['별도 협의', '서비스', '-'].some(s => raw.indexOf(s) === 0);
      if (special || raw === '') pstr = raw;
      else {
        const nn = parseInt(raw.replace(/[^0-9]/g, ''));
        pstr = isNaN(nn) ? raw : nn.toLocaleString();
      }
    }
    bucket.items.push({ name: name, price: pstr, desc: desc });
    count++;
  }

  // ---- 폼 재구성 ----
  document.getElementById('sections-wrap').innerHTML = '';
  secCount = 0;
  if (sections.length === 0) addSection('');
  else sections.forEach(s => addSection(s.name, s.items));
  updateTotal();
  return count;
}

function generate() {
  document.title = getQuoteFileBaseName();
  document.getElementById('quote-output').innerHTML = buildContent(false);
  document.getElementById('form-screen').style.display='none';
  document.getElementById('preview-screen').style.display='block';
  window.scrollTo(0,0);
}

function goBack() {
  document.getElementById('form-screen').style.display='block';
  document.getElementById('preview-screen').style.display='none';
}

function preparePrint() {
  document.title = getQuoteFileBaseName();
  window.print();
}

function downloadHTML() {
  const blob = new Blob([buildContent(true)], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${getQuoteFileBaseName()}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
